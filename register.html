<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>

<script>

$(document).ready(function(){

$("#registerForm").submit(function(e){

e.preventDefault();

$(".error").html("");
$("#response").html("");

var valid = true;

var name=$("#name").val().trim();
var mobile=$("#mobile").val().trim();
var email=$("#email").val().trim();
var address=$("#address").val().trim();
var pincode=$("#pincode").val().trim();
var gst = $("#gst").val().trim();
var rccopy = $("#rccopy").val();
var pan_number = $("#pan_number").val().trim();

var emailPattern =
/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if(name==""){
$("#name_error").html("Please enter name");
valid=false;
}
if(gst==""){
$("#gst_error").html("Please enter GST number");
valid=false;
}

/*if(rccopy==""){
$("#rccopy_error").html("Please upload RC copy");
valid=false;
} 
else
{
var ext=rccopy.split('.').pop().toLowerCase();

if($.inArray(ext,['jpg','jpeg','png','pdf'])==-1)
{
$("#document_error").html(
"Only JPG, JPEG, PNG and PDF allowed"
);
valid=false;
}

var fileSize =
$("#rccopy")[0].files[0].size;

if(fileSize > 2097152)
{
$("#document_error").html(
"Maximum file size 2MB"
);
valid=false;
}
}*/

if(mobile==""){
$("#mobile_error").html("Please enter mobile");
valid=false;
}
else if(!/^[0-9]{10}$/.test(mobile)){
$("#mobile_error").html("Enter valid 10 digit mobile");
valid=false;
}

if(email==""){
$("#email_error").html("Please enter email");
valid=false;
}
else if(!emailPattern.test(email)){
$("#email_error").html("Enter valid email");
valid=false;
}

if(address==""){
$("#address_error").html("Please enter address");
valid=false;
}
if(pan_number==""){
$("#pan_error").html("Please enter Pan Number");
valid=false;
}

if(pincode==""){
$("#pincode_error").html("Please enter pincode");
valid=false;
}
else if(!/^[0-9]{6}$/.test(pincode)){
$("#pincode_error").html("Enter valid pincode");
valid=false;
}

if(!$("#terms").is(":checked")){
$("#terms_error").html("Please accept Terms");
valid=false;
}

if(valid==false){
return false;
}

$("#submitBtn")
.prop("disabled",true)
.text("Please Wait...");
var formData = new FormData(document.getElementById("registerForm"));
$.ajax({

url:"save-registration.php",
type:"POST",
data:formData,
processData: false,
contentType: false,
cache: false,
success:function(res){

if(res.status=="success")
{
$("#response").html(
'<div class="success">'+
res.message+
'</div>'
);

$("#registerForm")[0].reset();
}
else
{
$("#response").html(
'<div class="error">'+
res.message+
'</div>'
);
}

$("#submitBtn")
.prop("disabled",false)
.text("Create Account");

$("#regSuccess")
.prop("disabled", false);


}

});

});

});

</script>
